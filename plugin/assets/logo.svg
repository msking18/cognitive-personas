<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradTriad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="60" cy="60" r="54" fill="#0F172A" stroke="url(#gradTriad)" stroke-width="2.5" />
  
  <!-- Central Triad Geometry (Teacher, Critic, Teammate) -->
  <polygon points="60,24 92,84 28,84" fill="none" stroke="url(#gradTriad)" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Nodes -->
  <circle cx="60" cy="24" r="7" fill="#6366F1" filter="url(#glow)" />
  <circle cx="92" cy="84" r="7" fill="#EF4444" filter="url(#glow)" />
  <circle cx="28" cy="84" r="7" fill="#10B981" filter="url(#glow)" />
  
  <!-- Center Core Synapse -->
  <circle cx="60" cy="64" r="4" fill="#F8FAFC" />
  <line x1="60" y1="24" x2="60" y2="64" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="92" y1="84" x2="60" y2="64" stroke="#F87171" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="28" y1="84" x2="60" y2="64" stroke="#34D399" stroke-width="1.5" stroke-dasharray="2,2" />
</svg>
